<!DOCTYPE html>
<html>
<body>
<p id="demo">Loading…</p>
<script src="unwrap-fisheye.js"></script>
<script>
const params = {
  "view": "side",
  "crop": 1,
  "aspect": 1.58,
  "start": 0,
  "cx": 0,
  "cy": 2,
  "radius": 93,
  "mirror": false,
  "maxSide": 1800,
  "locale": "zh",
  "trim": { "left": 0, "top": 44, "right": 0, "bottom": 0 }
};
async function photo() {
  const result = await UnwrapFisheye.unwrap("try-fisheye.jpg", params);
  const demo = document.getElementById("demo");
  demo.textContent = result.summary + " " + result.width + "×" + result.height;
  demo.after(result.canvas);
}
photo().catch((err) => {
  document.getElementById("demo").textContent = err.message;
});
</script>
</body>
</html>
